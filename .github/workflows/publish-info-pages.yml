name: Publicera Mordarkivet info-sidor

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Skapa sidor
        run: |
          mkdir -p site

          cat > site/support.html <<'EOF'
          <!doctype html>
          <html lang="sv">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Support – Mordarkivet</title>
            <style>
              :root {
                color-scheme: light dark;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              }

              body {
                margin: 0;
                background: #111418;
                color: #f4f1ea;
                line-height: 1.6;
              }

              main {
                max-width: 760px;
                margin: 0 auto;
                padding: 40px 22px 70px;
              }

              h1, h2 {
                line-height: 1.25;
              }

              h1 {
                font-size: 2rem;
                margin-bottom: 8px;
              }

              h2 {
                margin-top: 34px;
                font-size: 1.25rem;
              }

              p, li {
                color: #d8d5cf;
              }

              a {
                color: #e3b86b;
              }

              .card {
                margin-top: 24px;
                padding: 20px;
                border: 1px solid #343940;
                border-radius: 14px;
                background: #181c21;
              }

              .muted {
                color: #aaa;
                font-size: .95rem;
              }
            </style>
          </head>

          <body>
          <main>
            <h1>Support för Mordarkivet</h1>
            <p>
              Behöver du hjälp med Mordarkivet eller har du upptäckt ett fel?
              Här hittar du information om support och felsökning.
            </
